experiment:
  name: compare_renderers
  output_dir: analysis/output

renderer:
  backend: torch
  device: auto
  camera_width: 16
  scene_height: 8
  projector_width: 8
  noise_std: 0.012
  depth_shading_strength: 0.3
  ambient: 0.12
  spp: 1
  pattern_texture_height: 4

scene:
  depth_profile: slanted_wave
  camera_width: 16
  scene_height: 8

patterns:
  count: 2
  initial_method: random
  seed: 7
  lowpass_fraction: 0.35
  apply_frequency_constraint: true

decoder:
  type: zncc
  neighborhood: 1

optimization:
  gradient_method: finite_difference
  iterations: 1
  learning_rate: 0.25
  epsilon: 0.03
  temperature: 25.0
  joint_optimize_decoder: false

renderer_comparison:
  backends: [torch, mitsuba]
  gradient_method: finite_difference
  system_paths:
    - name: torch_autograd
      backend: torch
      gradient_method: autograd
  materials: [diffuse]
  noise_levels: [0.012]
  depth_profiles: [slanted_wave]
