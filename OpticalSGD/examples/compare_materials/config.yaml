experiment:
  name: compare_materials
  output_dir: analysis/output

renderer:
  backend: torch
  device: auto
  camera_width: 512
  scene_height: 64
  projector_width: 256
  noise_std: 0.012
  depth_shading_strength: 0.3
  ambient: 0.12

scene:
  depth_profile: slanted_wave
  camera_width: 512
  scene_height: 64

patterns:
  count: 8
  initial_method: random
  seed: 7
  lowpass_fraction: 0.35
  apply_frequency_constraint: true

decoder:
  type: zncc
  neighborhood: 1

optimization:
  gradient_method: autograd
  iterations: 60
  learning_rate: 0.25
  epsilon: 0.03
  temperature: 25.0
  joint_optimize_decoder: false

material_comparison:
  materials: [diffuse, marble, wood, frosted_glass]
